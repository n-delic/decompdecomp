# Each archive is a whole install: `keep` takes its compiler (Bin) and headers (Include: Visual C++'s and the Windows
# SDK's in one folder, as the 6.0-7.1 pack has them), so the project's build finds every version the same way.
# 2005's RTM and SP1 share the Rich header's build (50727), so an import takes SP1, the one most 2005 games were built
# with; RTM is there for the rest (#42): try_compiler and Settings switch a file to it. wibo has no msvcp100.dll of its own (2010's compiler calls a few of its functions), so 2010's Bin gets the
# Visual C++ 2010 redistributable's, from the archive the CodeWarrior pack (mwcc) already pins.
