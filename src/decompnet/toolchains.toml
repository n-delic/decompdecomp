cplusplus = true
name = "EE-GCC 2.96"
platform = "PS2"
arch = "mipsel"
license = "GPL-2.0"
source = "decompme/compilers release 'compilers'"
description = "The GCC 2.96 Emotion Engine compiler from the PS2 SDK era."
requires = ["runtime-i386"]
cc = ["{tc}/bin/ee-gcc", "-c"]
flags = ["-O2", "-G0"]
# Its assembler (2.10-ee) misencodes a switch's `lui` as `lw` when the jump table load is the first thing in .text:
