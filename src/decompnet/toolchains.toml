url = "https://mirrors.slackware.com/slackware/slackware-2.2.0/source/d/gcc/gcc-2.6.3.tar.gz"
sha256 = "66529b6ced4ccc580ec365809c1abed856d948283deff656801dec14f47d081a"
platforms = ["macos-arm64", "macos-x86_64"]
