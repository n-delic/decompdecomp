["ee-gcc-2.96"]
cplusplus = true
name = "EE-GCC 2.96"
platform = "PS2"
arch = "mipsel"
license = "GPL-2.0"
source = "decompme/compilers release 'compilers'"
description = "The GCC 2.96 Emotion Engine compiler from the PS2 SDK era."
requires = ["runtime-i386"]
cc = ["{tc}/bin/ee-gcc", "-c"]
flags = ["-O2", "-G0"]
# Its assembler (2.10-ee) misencodes a switch's `lui` as `lw` when the jump table load is the first thing in .text:
# a function compiled on its own (or first in an exported file) would never match. An alignment first avoids it.
prelude = "__asm__(\".text\\n.align 3\");\n"
[["ee-gcc-2.96".parts]]
url = "https://github.com/decompme/compilers/releases/download/compilers/ee-gcc2.96.tar.xz"
sha256 = "0590d2ca9da8f5903889d66761220d14b47a8d14ba987ca53db84a1650a1fd0a"
platforms = ["linux-x86_64"]

