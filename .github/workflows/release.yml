# A tag v* (e.g. v1.0.0-alpha) builds the Linux packages and Windows setup bundle and attaches them to the tag's GitHub
# release, creating the release when there isn't one yet, as the latest (alphas too: the version says what it is,
# and GitHub shows "Latest" and serves releases/latest only for a release that isn't a pre-release). It can also be
# run by hand for a tag that's already pushed: gh workflow run release -f tag=v1.0.0-alpha
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: the tag to build and release (v1.2.3)
        required: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: astral-sh/setup-uv@v10.3.0  # setup-uv has published no major tags since v7
      - name: the version in the tag is the version in the code
        run: test "v$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)" = "$TAG"
      - name: appimagetool checks the apps-menu entry with desktop-file-validate; rpmbuild makes the .rpm
        run: sudo apt-get install -y --no-install-recommends desktop-file-utils rpm
      - name: build the .deb, the .rpm and the AppImage
        run: packaging/linux/build.sh
      - name: attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.deb dist/*.rpm dist/*.AppImage --clobber
          else
            gh release create "$TAG" dist/*.deb dist/*.rpm dist/*.AppImage --generate-notes --latest
          fi

  windows:
    needs: linux
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: astral-sh/setup-uv@v10.3.0
      - name: the version in the tag is the version in the code
        shell: pwsh
        run: |
          $version = (Select-String '^version = "(.*)"' pyproject.toml).Matches.Groups[1].Value
          if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG does not match project version $version" }
      - name: Build the Windows setup bundle
        shell: pwsh
        run: packaging/windows/build.ps1
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $installer = (Get-ChildItem dist -Filter '*-windows-x64-setup.exe' | Select-Object -First 1).FullName
          if (-not $installer) { throw 'Windows setup bundle was not created.' }
          gh release view $env:TAG 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $installer --clobber
          } else {
            gh release create $env:TAG $installer --generate-notes --latest
          }
