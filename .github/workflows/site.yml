# The website (site/public, static files) on GitHub Pages at decomp.ndelic.com, published on every push to main that
# changes it. (Pages ignores site/public/_headers and _redirects: those are for Cloudflare, see site/wrangler.jsonc.)
name: site

on:
  push:
    branches: [main]
    paths: ["site/public/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/public
      - id: deployment
        uses: actions/deploy-pages@v5
