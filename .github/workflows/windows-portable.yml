name: Windows portable build
on:
  pull_request:
    paths:
      - .github/workflows/windows-portable.yml
      - .github/workflows/release.yml
      - packaging/windows/**
      - tests/test_windows_portable.py
      - src/decompnet/app/launcher.py
      - pyproject.toml
      - uv.lock
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Check native launcher argument forwarding
        run: uv run pytest tests/test_windows_portable.py -q
      - name: Build and smoke test relocated portable EXE
        shell: pwsh
        run: packaging/windows/build.ps1 -PortableOnly
      - uses: actions/upload-artifact@v4
        with:
          name: decompdecomp-windows-x64-portable
          path: dist/*-windows-x64-portable.zip
          if-no-files-found: error
