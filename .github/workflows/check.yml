# Every push to main and every pull request: ruff, then the tests. The free compilers N64, PS1, PS2 and PSP games are built
# with are installed (pinned and checked, by decompdecomp's own installer, and cached), so the consoles' conformance
# tests (tests/test_consoles.py) really run here on those consoles' demo games. The proprietary compilers
# (CodeWarrior, Visual C++, IDO) can't be: the tests that need them skip, and say why. Ghidra is installed on every
# system (on a Mac it builds its decompiler), so the calling conventions PC imports take from it are checked on each
# (tests/test_ghidra.py): a Mac's Ghidra had no decompiler, and its imports named every __fastcall function wrong.
# uv sync installs the dev group, so pytest-xdist and pytest-timeout are here: pytest's addopts in pyproject.toml
# spreads the ~10,000 tests across the runner's cores and caps a hung test. All three jobs run the whole suite,
# deliberately: the same tests are the OS coverage for Windows, macOS and Linux.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    needs: check
    runs-on: blacksmith-4vcpu-windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync
      - run: uv run ruff check src tests projects
      - uses: actions/setup-java@v5  # Ghidra runs on a Java 21+ JDK
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache Ghidra (again when toolchains.toml changes)
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/decompnet/toolchains/ghidra
          key: ghidra-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/decompnet/toolchains.toml') }}
      - name: Ghidra (on a Mac its decompiler is built), for tests/test_ghidra.py
        run: uv run python -c "from decompnet import toolchains; toolchains.install('ghidra')"
      - name: Native Windows and portable regression tests
        run: uv run pytest -q -rs
        env:
          DECOMP_TRAY: "0"
  macos:
    needs: check
    runs-on: blacksmith-6vcpu-macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: uv run ruff check src tests projects
      - name: Demo linker and object tools
        run: |
          brew install llvm lld
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
      - name: Check Intel compiler runtime on Apple Silicon
        run: |
          if [ "$(uname -m)" = arm64 ]; then
            /usr/bin/arch -x86_64 /usr/bin/true
          fi
      - name: Free pinned N64 compiler and decompilation tools
        run: >-
          uv run python -c "from decompnet import toolchains; [toolchains.install(t) for t in
          ['gcc-2.7.2-kmc', 'binutils-mips', 'm2c', 'decomp-permuter', 'objdiff-cli']]"
      - uses: actions/setup-java@v5  # Ghidra runs on a Java 21+ JDK
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache Ghidra (again when toolchains.toml changes)
        uses: actions/cache@v6
        with:
          path: ~/Library/Application Support/decompnet/toolchains/ghidra
          key: ghidra-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/decompnet/toolchains.toml') }}
      - name: Ghidra (on a Mac its decompiler is built), for tests/test_ghidra.py
        run: uv run python -c "from decompnet import toolchains; toolchains.install('ghidra')"
      - name: Native WebKit and portable regressions, including N64 demo matching and rebuild
        run: uv run pytest -q -rs
        env:
          DECOMP_TEST_COCOA: "1"
          DECOMP_TRAY: "0"
  check:
    outputs:
      portable_changed: ${{ steps.portable_changes.outputs.changed }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Detect portable packaging changes
        id: portable_changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=HEAD^
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            base="$BEFORE"
            if [[ "$base" =~ ^0+$ ]]; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$base"
            fi
          fi
          if [ -n "$(git diff --name-only "$base" HEAD -- packaging/windows .github/workflows/check.yml .github/workflows/windows-portable.yml tests/test_windows_portable.py src/decompnet/app/launcher.py pyproject.toml uv.lock)" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@v10.3.0  # setup-uv has published no major tags since v7
      - run: uv sync
      - run: uv run ruff check src tests projects
      - name: The N64 demo's linker (ld.lld, llvm-objcopy)
        run: sudo apt-get install -y --no-install-recommends lld llvm
      - name: Cache the compilers (again when toolchains.toml changes)
        uses: actions/cache@v6
        with:  # m2c isn't cached: it's a Python environment of its own, made again each time
          path: |
            ~/.local/share/decompnet/toolchains/gcc-2.7.2-kmc
            ~/.local/share/decompnet/toolchains/ee-gcc-2.96
            ~/.local/share/decompnet/toolchains/runtime-i386
            ~/.local/share/decompnet/toolchains/binutils-mips
            ~/.local/share/decompnet/toolchains/gcc-2.7.2-psx
            ~/.local/share/decompnet/toolchains/maspsx
            ~/.local/share/decompnet/toolchains/psp-gcc-1.3.1
            ~/.local/share/decompnet/toolchains/psp-gcc-1.7.1
          key: toolchains-${{ runner.os }}-${{ hashFiles('src/decompnet/toolchains.toml') }}
      - name: The free compilers N64, PS1, PS2 and PSP games were built with, and m2c for drafts
        run: >-
          uv run python -c "import sys; from decompnet import toolchains; [toolchains.install(t) for t in sys.argv[1:]]"
          gcc-2.7.2-kmc ee-gcc-2.96 gcc-2.7.2-psx binutils-mips m2c psp-gcc-1.3.1 psp-gcc-1.7.1
      - uses: actions/setup-java@v5  # Ghidra runs on a Java 21+ JDK
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache Ghidra (again when toolchains.toml changes)
        uses: actions/cache@v6
        with:
          path: ~/.local/share/decompnet/toolchains/ghidra
          key: ghidra-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/decompnet/toolchains.toml') }}
      - name: Ghidra (on a Mac its decompiler is built), for tests/test_ghidra.py
        run: uv run python -c "from decompnet import toolchains; toolchains.install('ghidra')"
      - uses: dtolnay/rust-toolchain@stable
      - name: The MCP gateway (gateway/), so tests/test_mcp_gateway.py runs against it
        run: |
          cargo test --locked --manifest-path gateway/Cargo.toml
          cargo build --release --locked --manifest-path gateway/Cargo.toml
      - run: uv run pytest -q -rs
        env:
          DECOMP_TRAY: "0"

  portable:
    needs: check
    if: needs.check.outputs.portable_changed == 'true'
    uses: ./.github/workflows/windows-portable.yml
