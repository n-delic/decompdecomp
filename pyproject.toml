[project]
name = "decompnet"
version = "1.0.9+rr.2"
description = "A desktop app where AI agents decompile the games you own into C that rebuilds them byte for byte. Runs locally."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "LICENSE-decomp.wtf"]
authors = [
    { name = "sam wolfs", email = "appelsiensam@gmail.com" },  # decomp.wtf, up to 0.10.6
    { name = "NDelic" },  # decompdecomp
]
requires-python = ">=3.12"
dependencies = [
    "capstone>=5.0.9",
    "mcp>=2.3.0",
    "pyelftools>=0.33",
    "splat64[mips]>=0.50.1",
    "spimdisasm>=1.42.4",
    "rabbitizer>=1.16.2",
    # the repair families, RetroReversing/decomp-repair: a tagged archive, so installing needs no git
    "decomprepair @ https://github.com/RetroReversing/decomp-repair/archive/refs/tags/v0.1.0.tar.gz",
    "httpx>=0.28",
    "uvicorn>=0.30",
    "ninja>=1.11",  # builds GameCube/Wii (dtk) and other ninja-based decomp projects
    "zstandard>=0.23; sys_platform == 'linux' or sys_platform == 'win32'",  # .zst toolchains: Linux's 32-bit runtime and Windows IDO's MSYS2 runtime, without the zstd command
    "pywebview>=6.2.1; sys_platform == 'win32'",  # the tested WinForms/WebView2 bridge and native shortcut support
    "pyobjc-framework-Cocoa>=11.0; sys_platform == 'darwin'",  # native macOS window, dialogs, and Finder launcher
    "pyobjc-framework-WebKit>=11.0; sys_platform == 'darwin'",  # WKWebView with the private window user agent
    "tzdata>=2025.2; sys_platform == 'win32'",  # Windows has no IANA timezone database for helpers' reset times
]

[project.urls]
Homepage = "https://github.com/RetroReversing/decompdecomp"
Source = "https://github.com/RetroReversing/decompdecomp"

[project.scripts]
decomp = "decompnet.app.cli:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.6",
    "pytest-timeout>=2.3",
    "ruff==0.14.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
# the website's tooling isn't decompdecomp's code; ninja_syntax.py is ninja's own, copied into the project templates
extend-exclude = ["site", "src/decompnet/consoles/*/project_template/tools/ninja_syntax.py"]

[tool.ruff.lint]
# Only rules that find real problems or real inconsistencies: no formatter, no line length (docs/CONVENTIONS.md, "Linting")
select = ["F", "I", "E9", "B006", "B008", "B023"]

[tool.ruff.lint.isort]
# decomprepair is a dependency now, kept with decompnet so its imports stay grouped as they were written
known-first-party = ["decompnet", "decomprepair"]

[tool.pytest.ini_options]
# ~10,000 tests: run them in parallel. loadscope keeps a module's tests on one worker, so its
# module-scoped fixtures are built once instead of once per worker. Override with `-n 0` for a
# single process when debugging a test that needs it.
addopts = "-n auto --dist loadscope --timeout 1200"
# A cap on a stuck test (deadlocked Event.wait, hung tool). 1200 s leaves room for the demo builds
# that already pass timeout=900 to build.py; tighten it once those are marked and given their own cap.
markers = ["slow: needs a real toolchain, a demo build or a long wait (CI installs the tools)",
           "tools: needs a compiler or decompiler installed on this machine"]
# the room tests drive the room server through Starlette's TestClient, which warns about the timeouts real clients use.
# A background thread that raises fails its test: pytest only warned when a project's indexing thread called a
# test's stand-in with an argument it didn't take (PR #139)
filterwarnings = ["ignore:You should not use the 'timeout' argument with the TestClient",
                  "error::pytest.PytestUnhandledThreadExceptionWarning"]
